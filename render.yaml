services:
  - type: web
    name: legalease-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: APP_NAME
        value: LegalEase
      - key: LOGO_PATH
        value: assets/logo.png
      - key: REQUEST_TIMEOUT_SECONDS
        value: "90"